<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Treinando posicionamento - Loja de roupas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="barra-navegacao">
        <div class="logo">
            <img src="imagens/zirtaeb_logo.png" alt="logo da marca" width="260";>
        </div>

        <nav class="menu-navegacao">
            <a href ="#inicio" >Inicio</a>
            <a href="#categorias">Categorias</a>
            <a href="#produtos">Produtos</a>
        </nav>

        <div class="acoes">
            <button type="button">CARRINHO</button>
            <button type="button">FAVORITOS</button>

        </div>
    </header>
    <main>
        <section id="inicio">
            <h2>NÃO SIGA TENDÊNCIAS. SEJA A TENDÊNCIA.</h2>
            <article class="banner"> 
                <img src="imagens/Banner de Moda ZIRTAEB em Bronze.png" alt="">
            </article>
        </section>
    
        <section id="categorias" >
        <h2> A MODA É STAR NA MODA </h2>
            <article>
                <div class="cards">
                <img src="imagens/style 1.png" alt="Baddie" width="400px">
                <img src="imagens/style 2.png" alt="y2k" width="400px" >
                <img src="imagens/style 3.png" alt="baddie" width="400px">
                <img src="imagens/styl 4.png" alt="y2k" width="400px" >
                 </div>
            </article>
        </section>

        <section id="produtos">
            <h2> CONFIRA NOSSOS PRODUTOS</h2>
            <article>
                <div class="valores">
                    <img src="imagens/CALÇA JRANS.png" alt="Imagem de uma calça jeans">
                  <h2>Calça Flare Denim</h2>
                  <p>R$169,90</p>

                    <img src="imagens/JAQUETA ROSA.png" alt="Imagem de uma jaqueta rosa">   
                      <h2>Jaqueta Pink Velour</h2>
                      <p>R$159,90</p> 
                  
                    <img src="imagens/ONCNH.png" alt="Imagem vestido de onça">
                    <h2>Vestido Oncinha Diva</h2>
                    <p>R$139,90</p>

                    <img src="imagens/TOP BRANCO.png" alt="Imagem top branco">
                    <h2>Top Branco Star</h2>
                    <p>R$89,90</p>

                    <img src="imagens/COSRSET AZUL.png" alt="Imagem corset azul">
                    <h2>Corset Blue Butterfly</h2>
                    <p>R$119,90</p>
                    </div>

            </article>

        </section>


    </main>

</body>

</html>
